# Siti monitorati per NUOVI prodotti nelle sezioni preordini.
# Aggiungere un sito = aggiungere una voce qui (nessun codice nuovo, salvo adapter mancante).
#
# type: shopify -> usa /collections/<x>/products.json (url = pagina collezione)
# type: html    -> scraping con selettori CSS:
#                  selector:        card prodotto (o direttamente il link)
#                  title_selector:  (opzionale) elemento col titolo, dentro la card
#                  link_selector:   (opzionale) <a> col link, dentro la card
#                  senza title/link_selector: la card stessa deve essere un <a>

sites:
  - name: Cardmaniac
    type: shopify
    url: https://cardmaniac.ch/collections/pre-order

  - name: Pokecado
    type: shopify
    url: https://www.pokecado.ch/collections/vorbestellungen-bei-pokecado

  - name: Pokecard Store (One Piece)
    type: shopify
    url: https://pokecard.store/collections/op-vorbestellungen

  - name: Pokecard Store
    type: shopify
    url: https://pokecard.store/collections/vorbestellung

  - name: Pikaversum
    type: shopify
    url: https://pikaversum.ch/collections/pre-order

  - name: Skyspell
    type: shopify
    url: https://skyspell.ch/collections/pre-orders

  - name: Maro Shop (Pokémon)
    type: shopify
    url: https://www.maro-shop.ch/collections/pokemon-vorverkauf

  - name: Maro Shop (One Piece)
    type: shopify
    url: https://www.maro-shop.ch/collections/one-piece-vorverkauf

  - name: Lascho Cards
    type: shopify
    url: https://laschocards.ch/collections/pre-order

  - name: Amazing Toys
    type: html
    url: https://amazingtoys.ch/Pre-Order/?immediately-available=1
    selector: ".product-box"
    title_selector: "a.product-name"
    link_selector: "a.product-name"
    price_selector: ".product-price"

  - name: Pokestore
    type: html
    url: https://www.pokestore.ch/pre-orders
    selector: '[data-hook="product-list-grid-item"]'
    title_selector: '[data-hook="product-item-name"]'
    link_selector: 'a[href*="/product-page/"]'
    price_selector: '[data-hook="product-item-price-to-pay"]'

# Sezioni sorvegliate per SCONTI: notifica quando un prodotto cala di prezzo
# rispetto al run precedente, o quando compare nella sezione già con prezzo
# barrato. Stessa sintassi di `sites`; per type: html serve anche
# price_selector. `interval: N` (minuti) rallenta le sezioni pesanti.

sales:
  - name: Cardmaniac Pokémon
    type: shopify
    url: https://cardmaniac.ch/collections/pokemon-tcg-karten-kaufen
  - name: Cardmaniac One Piece
    type: shopify
    url: https://cardmaniac.ch/collections/one-piece
  - name: Pokecado Neuheiten
    type: shopify
    url: https://www.pokecado.ch/collections/neuheiten-pokemon-tcg-pokecado
  - name: Pokecard Store Pokémon
    type: shopify
    url: https://pokecard.store/collections/pokemon
  - name: Pokecard Store One Piece
    type: shopify
    url: https://pokecard.store/collections/one-piece-1
  - name: Pikaversum Pokémon
    type: shopify
    url: https://pikaversum.ch/collections/pokemon-trading-card-game
  - name: Pikaversum One Piece
    type: shopify
    url: https://pikaversum.ch/collections/one-piece-card-game
  - name: Skyspell Pokémon
    type: shopify
    url: https://skyspell.ch/collections/pokemon-sammelkartenspiel
  - name: Skyspell One Piece Box
    type: shopify
    url: https://skyspell.ch/collections/one-piece-booster-box
  - name: Maro Shop Pokémon
    type: shopify
    url: https://www.maro-shop.ch/collections/pokemon
  - name: Maro Shop One Piece
    type: shopify
    url: https://www.maro-shop.ch/collections/one-piece
  - name: Lascho Cards Pokémon EN
    type: shopify
    url: https://laschocards.ch/collections/englische-pokemon-karten
  - name: Lascho Cards Pokémon JP
    type: shopify
    url: https://laschocards.ch/collections/japanische-pokemon-karten
  - name: Amazing Toys Pokémon
    type: html
    url: https://amazingtoys.ch/Pokemon/?immediately-available=1
    selector: ".product-box"
    title_selector: "a.product-name"
    link_selector: "a.product-name"
    price_selector: ".product-price"
    page_param: p
    interval: 30        # ~42 pagine HTML: ogni 30 min, non ogni 5
  - name: Pokestore Pokémon
    type: html
    url: https://www.pokestore.ch/pokemon
    selector: '[data-hook="product-list-grid-item"]'
    title_selector: '[data-hook="product-item-name"]'
    link_selector: 'a[href*="/product-page/"]'
    price_selector: '[data-hook="product-item-price-to-pay"]'
    page_param: page
  - name: Pokestore One Piece
    type: html
    url: https://www.pokestore.ch/one-piece-tcg
    selector: '[data-hook="product-list-grid-item"]'
    title_selector: '[data-hook="product-item-name"]'
    link_selector: 'a[href*="/product-page/"]'
    price_selector: '[data-hook="product-item-price-to-pay"]'
    page_param: page

